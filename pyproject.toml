[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist2phone"
version = "0.1.0"
description = "Preview-first, copy-only syncing from a master MP3 library to marked USB storage"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Playlist2Phone contributors" }]
dependencies = []

[project.scripts]
playlist2phone = "playlist2phone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
