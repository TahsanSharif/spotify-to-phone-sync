[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist2phone"
version = "0.5.0"
description = "Preview-first music sync for Android phones over USB MTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
android = ["comtypes>=1.4.11"]

[project.scripts]
playlist2phone = "playlist2phone.cli:main"
playlist2phone-devices = "playlist2phone.android:main"
playlist2phone-inspect = "playlist2phone.android:inspect_main"
playlist2phone-android-preview = "playlist2phone.android:preview_main"
playlist2phone-android-transfer = "playlist2phone.android:transfer_main"
playlist2phone-android-transfer = "playlist2phone.android:transfer_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
