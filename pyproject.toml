[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist2phone"
version = "0.2.0"
description = "Preview-first music sync for Android phones over USB MTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
android = ["mtp==2.0.9"]

[project.scripts]
playlist2phone = "playlist2phone.cli:main"
playlist2phone-devices = "playlist2phone.android:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
