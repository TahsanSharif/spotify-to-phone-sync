[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist2phone"
version = "0.1.0"
description = "Preview-first MP3 copying to USB mass-storage music devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
playlist2phone = "playlist2phone.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
