[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist2phone"
version = "0.2.2"
description = "Preview-first music sync for Android phones over USB MTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The Windows MTP adapter is vendored from the upstream MIT-licensed project.
android = ["comtypes>=1.4.11"]

[project.scripts]
playlist2phone = "playlist2phone.cli:main"
playlist2phone-devices = "playlist2phone.android:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
